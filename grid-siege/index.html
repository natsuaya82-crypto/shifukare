<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1928"><title>GRID SIEGE Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1928;color:#f4f0e8;font:15px system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:14px}.panel{background:#172f49;border:1px solid #36536e;border-radius:18px;padding:14px}.top,.stats,.tools,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}.top h1{margin:0;font-size:22px}.muted{color:#a9b7ca;font-size:12px}.stats{margin:12px 0}.stat{flex:1;min-width:130px;background:#10253a;border-radius:12px;padding:10px}.stat b{display:block;font-size:23px;color:#f3e3c3}.bar{height:7px;background:#263b50;border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:#e8b93b;width:100%}.phase{background:#8b6b22;border:1px solid #e8b93b;border-radius:10px;padding:9px 12px}.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;max-width:560px;margin:10px auto;background:#091724;padding:5px;border-radius:12px;touch-action:manipulation}.cell{aspect-ratio:1;min-width:0;background:#29445a;border:1px solid #49647a;border-radius:5px;display:grid;place-items:center;font-size:clamp(14px,5vw,27px);position:relative;user-select:none}.enemy{background:#382f3a}.own{background:#254452}.middle{background:#0e1e2c;border:1px dashed #34495b}.castle{background:#66532c;border:2px solid #e8b93b}.wall{background:#68717a}.cannon{background:#52677a}.mortar{background:#766044}.trap{background:#665d82}.unit{background:#24658b}.large{grid-column:span 2;grid-row:span 2}.tools{justify-content:flex-start;margin:12px 0}.tool,button{border:1px solid #58718a;background:#203d58;color:white;border-radius:10px;padding:10px 12px;font:inherit}.tool.active,button.primary{background:#8b6b22;border-color:#e8b93b}.tool:disabled,button:disabled{opacity:.4}.hint{color:#e8d6a5;font-size:12px;line-height:1.5}.hidden{display:none}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.card{background:#203d58;border:1px solid #58718a;border-radius:10px;padding:10px 4px;text-align:center;font-size:12px}.card:disabled{opacity:.4}.log{background:#0e2032;border-radius:10px;padding:10px;min-height:60px;font-size:12px;color:#cbd7e1;margin-top:10px}@media(max-width:480px){main{padding:9px}.panel{padding:10px}.cell{border-radius:4px}.cards{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main><section class="panel">
<div class="top"><div><h1>GRID SIEGE</h1><div class="muted">7×7 / 3体編成 / オートバトル 試作</div></div><span id="phase" class="phase">配置フェーズ</span></div>
<div class="stats"><div class="stat">自軍の城 HP<b id="ph">1000</b><div class="bar"><i id="pb"></i></div></div><div class="stat">敵軍の城 HP<b id="eh">1000</b><div class="bar"><i id="eb"></i></div></div></div>
<div class="top"><b id="status">配置中</b><span id="count">キャラ 0 / 3</span></div><div id="board" class="board"></div>
<div class="muted">🟥 敵陣　🟦 自陣　🟫 城　中央列は配置不可</div>
<div id="setup">
<div class="tools"><button class="tool active" data-tool="select">選択</button><button class="tool" data-tool="unit">キャラ 1×1</button><button class="tool" data-tool="large">大型 2×2</button><button class="tool" data-tool="wall">壁 (1)</button><button class="tool" data-tool="cannon">大砲 (4)</button><button class="tool" data-tool="mortar">迫撃砲 (5)</button><button class="tool" data-tool="trap">電撃罠 (3)</button><button class="tool" data-tool="erase">撤去</button></div>
<div class="hint">自陣（下3段）にキャラ3体と防衛設備を配置。キャラは重複可能。大型キャラは2×2マスを使います。</div>
<div class="actions" style="margin-top:12px"><button id="next" class="primary">次へ：配置確認</button><button id="reset">配置リセット</button></div></div>
<div id="ready" class="hidden"><p class="hint">配置を確認してください。戻って配置を変更することもできます。</p><div class="actions"><button id="back">戻って編集</button><button id="start" class="primary">バトル開始</button></div></div>
<div id="battle" class="hidden"><div class="top"><b id="timer">90秒</b><span class="muted">スキルを選択して盤面をタップ</span></div><div class="cards"><button class="card" data-skill="ghost">👻 ゴースト<br><small>壁抜け</small></button><button class="card" data-skill="warp">🌀 ワープ<br><small>短距離移動</small></button><button class="card" data-skill="light">⚡ ライトニング<br><small>範囲攻撃</small></button><button class="card" data-skill="heal">💚 ヒール<br><small>回復</small></button></div><div class="hint">90秒で城を破壊できなければ延長戦。延長戦開始時に防御壁を撤去し、そのまま城の破壊まで続行します。</div></div>
<div id="log" class="log">キャラクターと防衛設備を配置してください。</div>
</section></main>
<script>
const board=document.getElementById("board"),objects=[],cells=[];let tool="select",phase="setup",skill="",hp=1000,enemyHp=1000,time=90,over=false,timer=null,ghostUntil=0,cool={ghost:0,warp:0,light:0,heal:0};const names={unit:"🧙",large:"🛡️",wall:"🧱",cannon:"💣",mortar:"🪨",trap:"⚡"};const cost={unit:0,large:0,wall:1,cannon:4,mortar:5,trap:3};
function at(x,y){return objects.find(o=>x>=o.x&&x<o.x+(o.w||1)&&y>=o.y&&y<o.y+(o.h||1))}
function valid(x,y,w=1,h=1){if(x<0||y<4||x+w>7||y+h>7||(x<=3&&x+w>3))return false;for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)if(at(xx,yy))return false;return true}
function render(){board.innerHTML="";cells.length=0;for(let y=0;y<7;y++)for(let x=0;x<7;x++){let c=document.createElement("button");c.className="cell";if(y<3)c.classList.add("enemy");else if(y===3)c.classList.add("middle");else c.classList.add("own");if((x===3&&y===0)||(x===3&&y===6)){c.classList.add("castle");c.textContent="🏰"}let o=at(x,y);if(o){c.className="cell "+(o.team==="e"?"enemy":"own")+" "+o.type;c.textContent=names[o.type]||" ";if(o.type==="large"&&o.x===x&&o.y===y)c.classList.add("large");if(o.type==="large"&&(o.x!==x||o.y!==y))c.textContent=""}c.dataset.x=x;c.dataset.y=y;c.onclick=()=>tap(x,y);board.append(c);cells.push(c)}document.getElementById("count").textContent="キャラ "+objects.filter(o=>o.team==="p"&&(o.type==="unit"||o.type==="large")).length+" / 3";document.getElementById("ph").textContent=hp;document.getElementById("eh").textContent=enemyHp;document.getElementById("pb").style.width=Math.max(0,hp/10)+"%";document.getElementById("eb").style.width=Math.max(0,enemyHp/10)+"%"}
function log(s){document.getElementById("log").textContent=s}
function tap(x,y){if(phase==="setup"){let old=at(x,y);if(tool==="erase"){if(old&&old.team==="p")objects.splice(objects.indexOf(old),1)}else if(tool!=="select"){if(old){log("そのマスには配置できません");return}let n=objects.filter(o=>o.team==="p"&&(o.type==="unit"||o.type==="large")).length;if((tool==="unit"||tool==="large")&&n>=3){log("キャラクターは3体までです");return}let w=tool==="large"?2:1,h=w;if(!valid(x,y,w,h)){log("その場所には配置できません");return}objects.push({x,y,w,h,type:tool,team:"p",hp:tool==="wall"?180:tool==="cannon"?260:tool==="mortar"?220:tool==="trap"?100:tool==="large"?420:180,max:tool==="large"?420:180})}render();return}
if(phase==="battle"&&skill){let u=objects.find(o=>o.team==="p"&&(o.type==="unit"||o.type==="large")&&o.x===x&&o.y===y);if(skill==="light"){objects.filter(o=>o.team==="e"&&Math.abs(o.x-x)<=1&&Math.abs(o.y-y)<=1).forEach(o=>o.hp-=180);enemyHp-=45;log("ライトニング発動！")}else if(skill==="heal"&&u){u.hp=Math.min(u.max,u.hp+140);log("味方を回復！")}else if((skill==="ghost"||skill==="warp")&&u){if(skill==="ghost"){u.ghost=5;ghostUntil=5;log("ゴースト！5秒間壁をすり抜ける")}else{u.y=Math.max(4,u.y-1);log("ワープ！前方へ移動")}}else{log("対象を選択してください");return}cool[skill]=skill==="light"?12:skill==="heal"?18:skill==="ghost"?20:24;skill="";render();return}}
document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("active",x===b))});
document.getElementById("next").onclick=()=>{if(objects.filter(o=>o.team==="p"&&(o.type==="unit"||o.type==="large")).length!==3){log("キャラクターを3体配置してください");return}phase="ready";document.getElementById("setup").classList.add("hidden");document.getElementById("ready").classList.remove("hidden");document.getElementById("phase").textContent="配置確認";document.getElementById("status").textContent="配置確認中"};
document.getElementById("back").onclick=()=>{phase="setup";document.getElementById("ready").classList.add("hidden");document.getElementById("setup").classList.remove("hidden");document.getElementById("phase").textContent="配置フェーズ";document.getElementById("status").textContent="配置中"};
document.getElementById("reset").onclick=()=>{objects.length=0;render();log("配置をリセットしました")};
document.getElementById("start").onclick=()=>{phase="battle";document.getElementById("ready").classList.add("hidden");document.getElementById("battle").classList.remove("hidden");document.getElementById("phase").textContent="バトル中";document.getElementById("status").textContent="自動戦闘中";objects.push({x:3,y:0,type:"unit",team:"e",hp:260,max:260},{x:2,y:1,type:"unit",team:"e",hp:200,max:200},{x:4,y:1,type:"unit",team:"e",hp:200,max:200});render();timer=setInterval(tick,1000);log("バトル開始！")};
document.querySelectorAll("[data-skill]").forEach(b=>b.onclick=()=>{let k=b.dataset.skill;if(cool[k]>0){log("クールタイム中です");return}skill=k;log("対象マスをタップしてください")});
function tick(){if(over)return;time--;Object.keys(cool).forEach(k=>cool[k]=Math.max(0,cool[k]-1));if(time<=0){time=0;objects.filter(o=>o.type==="wall").forEach(o=>objects.splice(objects.indexOf(o),1));document.getElementById("timer").textContent="延長戦";log("延長戦！防御壁を撤去しました。城を破壊するまで続行。")}
objects.filter(o=>o.team==="p"&&(o.type==="unit"||o.type==="large")).forEach(u=>{if(u.y>0){let next=objects.find(o=>o.team==="e"&&Math.abs(o.x-u.x)<=1&&Math.abs(o.y-(u.y-1))<=1);if(next){next.hp-=u.type==="large"?45:30;if(next.hp<=0)objects.splice(objects.indexOf(next),1)}else if(!objects.some(o=>o.type==="wall"&&o.x===u.x&&o.y===u.y-1)||u.ghost>0){u.y--;enemyHp-=12}}if(u.ghost>0)u.ghost--});
objects.filter(o=>o.team==="p"&&(o.type==="cannon"||o.type==="mortar")).forEach(o=>{let target=objects.find(v=>v.team==="e"&&(v.type==="unit"||v.type==="large"));if(target){target.hp-=o.type==="mortar"?24:32;if(target.hp<=0)objects.splice(objects.indexOf(target),1)}});
objects.filter(o=>o.team==="e"&&(o.type==="unit"||o.type==="large")).forEach(u=>{let target=objects.find(v=>v.team==="p"&&(v.type==="unit"||v.type==="large"||v.type==="cannon"||v.type==="mortar"));if(target){target.hp-=22;if(target.hp<=0)objects.splice(objects.indexOf(target),1)}else hp-=18});
if(enemyHp<=0||hp<=0){over=true;clearInterval(timer);log(enemyHp<=0?"勝利！敵城を破壊しました。":"敗北…自軍の城が破壊されました。")}document.getElementById("timer").textContent=document.getElementById("timer").textContent==="延長戦"?"延長戦":time+"秒";render()}
render();
</script></body></html>
